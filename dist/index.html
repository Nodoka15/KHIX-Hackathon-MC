<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegi Knights</title>
  <script type="module" crossorigin src="/assets/index-qiiAULdH.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-de_Ufjv3.css">
</head>
<body>
  <div id="game-container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="game-canvas" width="1280" height="720"></canvas>

    <div id="ui-layer">
      <!-- Top HUD -->
      <div class="hud-top">
        <!-- Local Player Stats -->
        <div class="player-hud local-hud">
          <div class="hud-top-meta">
            <div class="hud-tag">YOU (GOLD KNIGHT)</div>
            <div id="best-score-display" class="best-score-badge">BEST: 0</div>
          </div>
          <div class="hud-row">
            <div id="score-display">SCORE: 0</div>
            <div class="lives-box">
              <div class="heart" id="hp-1"></div>
              <div class="heart" id="hp-2"></div>
              <div class="heart" id="hp-3"></div>
            </div>
          </div>
        </div>

        <!-- Center Match Timer & Controls -->
        <div class="center-hud">
          <div id="mp-timer" style="display: none;">01:00</div>
          <div id="top-controls" class="top-controls" style="display: none;">
            <button id="next-opponent-btn" class="hud-chip-btn accent-cyan" style="display: none;">NEXT KNIGHT ⏭</button>
            <button id="menu-btn" class="hud-chip-btn">MAIN MENU</button>
          </div>
        </div>

        <!-- Opponent Player Stats (Multiplayer) -->
        <div id="opponent-hud" class="player-hud rival-hud" style="display: none;">
          <div class="hud-tag rival-tag">RIVAL KNIGHT</div>
          <div class="hud-row">
            <div id="opponent-score-display">FOE: 0</div>
            <div class="lives-box">
              <div class="heart rival-heart" id="opp-hp-1"></div>
              <div class="heart rival-heart" id="opp-hp-2"></div>
              <div class="heart rival-heart" id="opp-hp-3"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Synchronized Match Countdown Overlay -->
      <div id="countdown-banner" class="countdown-banner" style="display: none;">3</div>

      <!-- Center Modal (Menu / Calibration / Matchmaking / Game Over) -->
      <div id="modal-screen" class="hud-modal">
        <div id="modal-badge" class="modal-badge">UCF KNIGHTRO ARENA</div>
        <h1 id="modal-title">INITIALIZING SYSTEM</h1>
        <p id="modal-desc">
          Loading MediaPipe AI hand tracking models...
        </p>

        <!-- Main Menu Mode Selection -->
        <div id="menu-options" class="menu-options" style="display: none;">
          <button id="singleplayer-btn" class="mode-card-btn">
            <span class="mode-title">SINGLEPLAYER</span>
            <span id="sp-mode-sub" class="mode-sub">Solo Arcade • 3 Lives • Best: 0</span>
          </button>
          <button id="multiplayer-btn" class="mode-card-btn mp-card-btn">
            <span class="mode-title">MULTIPLAYER 1v1</span>
            <span class="mode-sub">Live Matchmaking • Shared Arena • 1v1 Battle</span>
          </button>
        </div>

        <!-- Modal Action Buttons -->
        <div id="modal-actions" class="modal-actions" style="display: none;">
          <button id="action-btn" class="flat-btn">START MATCH</button>
          <button id="secondary-btn" class="flat-btn cyan-btn" style="display: none;">NEXT OPPONENT ⏭</button>
          <button id="back-menu-btn" class="flat-btn outline-btn">MAIN MENU</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
