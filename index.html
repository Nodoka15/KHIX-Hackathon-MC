<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vegi Knights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="game-container">
    <video id="webcam" playsinline autoplay muted></video>
    <canvas id="game-canvas" width="1280" height="720"></canvas>

    <div id="ui-layer">
      <!-- Top HUD -->
      <div class="hud-top">
        <!-- Local Player Stats -->
        <div class="player-hud local-hud">
          <div class="hud-top-meta">
            <div class="hud-tag">You</div>
            <div id="best-score-display" class="best-score-badge">BEST: 0</div>
          </div>
          <div class="hud-row">
            <div id="score-display">SCORE: 0</div>
            <div class="lives-box" aria-label="Player Lives">
              <div class="heart" id="hp-1">
                <svg viewBox="0 0 24 24" class="heart-emblem">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </div>
              <div class="heart" id="hp-2">
                <svg viewBox="0 0 24 24" class="heart-emblem">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </div>
              <div class="heart" id="hp-3">
                <svg viewBox="0 0 24 24" class="heart-emblem">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Center Match Timer & Controls -->
        <div class="center-hud">
          <div id="mp-timer" style="display: none;">01:00</div>
          <div id="top-controls" class="top-controls" style="display: none;">
            <button id="next-opponent-btn" class="hud-chip-btn accent-cyan" style="display: none;">NEXT KNIGHT</button>
            <button id="menu-btn" class="hud-chip-btn">MAIN MENU</button>
          </div>
        </div>

        <!-- Opponent Player Stats (Multiplayer) -->
        <div id="opponent-hud" class="player-hud rival-hud" style="display: none;">
          <div class="hud-top-meta rival-meta">
            <div class="hud-tag rival-tag">RIVAL KNIGHT</div>
          </div>
          <div class="hud-row">
            <div id="opponent-score-display">FOE: 0</div>
            <div class="lives-box" aria-label="Rival Lives">
              <div class="heart rival-heart" id="opp-hp-1">
                <svg viewBox="0 0 24 24" class="heart-emblem">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </div>
              <div class="heart rival-heart" id="opp-hp-2">
                <svg viewBox="0 0 24 24" class="heart-emblem">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </div>
              <div class="heart rival-heart" id="opp-hp-3">
                <svg viewBox="0 0 24 24" class="heart-emblem">
                  <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Synchronized Match Countdown Overlay -->
      <div id="countdown-banner" class="countdown-banner" style="display: none;">3</div>

      <!-- Center Modal (Menu / Calibration / Matchmaking / Game Over) -->
      <div id="modal-screen" class="hud-modal">
        <div id="modal-badge" class="modal-badge"></div>
        <h1 id="modal-title">VEGI KNIGHTS</h1>
        <p id="modal-desc">
          Select your battle mode below
        </p>

        <!-- Main Menu Mode Selection -->
        <div id="menu-options" class="menu-options" style="display: none;">
          <button id="singleplayer-btn" class="mode-card-btn sp-card-btn">
            <span class="mode-title">SINGLEPLAYER</span>
            <span id="sp-mode-sub" class="mode-sub"></span>
          </button>
          <button id="multiplayer-btn" class="mode-card-btn mp-card-btn">
            <span class="mode-title">MULTIPLAYER 1v1</span>
          </button>
        </div>

        <!-- Modal Action Buttons -->
        <div id="modal-actions" class="modal-actions" style="display: none;">
          <button id="action-btn" class="flat-btn">START MATCH</button>
          <button id="secondary-btn" class="flat-btn cyan-btn" style="display: none;">NEXT OPPONENT</button>
          <button id="back-menu-btn" class="flat-btn outline-btn">MAIN MENU</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
